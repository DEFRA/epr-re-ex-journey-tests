name: Run Journey Tests on GitHub
description: Run epr-re-ex-journey-tests journey tests

inputs:
  epr-frontend:
    description: commit hash of epr-frontend
  epr-backend:
    description: commit hash of epr-backend
  epr-re-ex-admin-frontend:
    description: commit hash of epr-re-ex-admin-frontend
  branch:
    description: branch in this repo
    default: main
  journey-test-pr:
    description: is this action being called from a pr in this repo?
    default: 'false'
  test-scope:
    description: which specs to run - 'admin' (test/specs/admin only), 'frontend' (everything except test/specs/admin), or 'all'
    default: 'all'
  december-scope:
    description: "'only' runs just the December-waste specs (tagged @decWaste), 'exclude' runs everything else, 'all' runs both - applies to the browser specs under every test-scope; the API specs ignore it"
    default: 'all'
  test-suite:
    description: "which suite to run - 'api' (API specs, whatever the test-scope), 'a11y' (@accessibility specs), 'e2e' (browser specs except @accessibility) or 'all' (everything)"
    default: 'all'
  shard:
    description: "shard of the browser specs in scope in the form 'current/total', for example '2/3', dealt out round-robin by spec file; needs test-suite 'e2e' and a december-scope other than 'only', as files are dealt out before the tags are matched; empty runs them all"
    default: ''
  december-window-start:
    description: explicit override for DECEMBER_WASTE_WINDOW_START; empty lets the action derive one from december-scope (see "Resolve the December window" below)
    default: ''
  artifact-suffix:
    description: appended to this run's uploaded artifact names, so parallel matrix legs don't collide
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Check the inputs
      if: inputs.shard != '' && (inputs.test-suite != 'e2e' || inputs.december-scope == 'only')
      shell: bash
      run: |
        echo "::error::shard needs test-suite 'e2e' and a december-scope other than 'only', not '${{ inputs.test-suite }}' with '${{ inputs.december-scope }}': files are dealt out before the tags are matched, so some shards would hold no test"
        exit 1

    - name: Checkout repository if not called by Journey Test PR
      if: inputs.journey-test-pr == 'false'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: DEFRA/epr-re-ex-journey-tests
        ref: ${{inputs.branch}}

    # Lets the matching-branch builds in "Start docker compose" use the GitHub
    # Actions cache backend (--cache-from/--cache-to type=gha). Cheap/fast even
    # when none of the three services end up building from source this run.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    # Each service below is branch-matched independently, gated only on its own
    # commit input being empty — not on journey-test-pr. This way whichever one
    # service a caller already knows the exact commit for (because it's calling
    # from ITS OWN PR, e.g. epr-frontend's CI passing epr-frontend: github.sha)
    # skips matching entirely, while the other two still get branch-matched
    # against github.head_ref, same as when journey-test-pr is true and none of
    # the three are supplied.

    - name: Check for matching epr-frontend branch
      if: inputs.epr-frontend == ''
      id: frontend-branch
      shell: bash
      run: |
        BRANCH="${{ github.head_ref }}"
        if git ls-remote --heads https://github.com/DEFRA/epr-frontend.git "$BRANCH" | grep -q .; then
          echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Found matching epr-frontend branch: $BRANCH — will build from source"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No matching epr-frontend branch '$BRANCH' — using latest published image"
        fi

    - name: Checkout epr-frontend repository if matching branch exists
      if: inputs.epr-frontend == '' && steps.frontend-branch.outputs.exists == 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: DEFRA/epr-frontend
        ref: ${{ steps.frontend-branch.outputs.ref }}
        path: epr-frontend

    - name: Check for matching epr-backend branch
      if: inputs.epr-backend == ''
      id: backend-branch
      shell: bash
      run: |
        BRANCH="${{ github.head_ref }}"
        if git ls-remote --heads https://github.com/DEFRA/epr-backend.git "$BRANCH" | grep -q .; then
          echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Found matching epr-backend branch: $BRANCH — will build from source"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No matching epr-backend branch '$BRANCH' — using latest published image"
        fi

    - name: Checkout epr-backend repository if matching branch exists
      if: inputs.epr-backend == '' && steps.backend-branch.outputs.exists == 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: DEFRA/epr-backend
        ref: ${{ steps.backend-branch.outputs.ref }}
        path: epr-backend

    - name: Check for matching epr-re-ex-admin-frontend branch
      if: inputs.epr-re-ex-admin-frontend == ''
      id: admin-frontend-branch
      shell: bash
      run: |
        BRANCH="${{ github.head_ref }}"
        if git ls-remote --heads https://github.com/DEFRA/epr-re-ex-admin-frontend.git "$BRANCH" | grep -q .; then
          echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Found matching epr-re-ex-admin-frontend branch: $BRANCH — will build from source"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No matching epr-re-ex-admin-frontend branch '$BRANCH' — using latest published image"
        fi

    - name: Checkout epr-re-ex-admin-frontend repository if matching branch exists
      if: inputs.epr-re-ex-admin-frontend == '' && steps.admin-frontend-branch.outputs.exists == 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: DEFRA/epr-re-ex-admin-frontend
        ref: ${{ steps.admin-frontend-branch.outputs.ref }}
        path: epr-re-ex-admin-frontend

    # windowStart is MM-DDTHH:mm with no year, so it recurs annually against
    # the accreditation's own relevant year. Callers that want the window
    # closed (december-scope: exclude) don't need to compute a value
    # themselves: when no explicit december-window-start is given, this
    # derives one - tomorrow's MM-DD is strictly later than today on all 365
    # days, where a fixed 12-31 bound would open on 31 December itself. It is
    # tomorrow in UK time, as the services read the window: in summer time a
    # UTC tomorrow is already today in London for the last hour of the day. A
    # december-scope: only caller gets an empty value here, which Start
    # docker compose below then leaves for compose.yml's own always-open
    # default to take over.
    - name: Resolve the December window
      if: inputs.december-window-start == '' && inputs.december-scope == 'exclude'
      id: december-window
      shell: bash
      run: echo "start=$(TZ=Europe/London date -d tomorrow +%m-%d)T00:00" >> "$GITHUB_OUTPUT"

    # Starts in the background so the builds of any matching branches and the
    # image pulls overlap the installs below. Each EPR_* value prefers the
    # caller-supplied commit, falls back to the matching branch's short SHA,
    # and falls back again (empty) to compose.yml's own :latest default.
    - name: Start docker compose
      shell: bash
      env:
        BUILD_FRONTEND: ${{ inputs.epr-frontend == '' && steps.frontend-branch.outputs.exists == 'true' }}
        BUILD_BACKEND: ${{ inputs.epr-backend == '' && steps.backend-branch.outputs.exists == 'true' }}
        BUILD_ADMIN_FRONTEND: ${{ inputs.epr-re-ex-admin-frontend == '' && steps.admin-frontend-branch.outputs.exists == 'true' }}
        EPR_FRONTEND: ${{ inputs.epr-frontend }}
        EPR_BACKEND: ${{ inputs.epr-backend }}
        EPR_RE_EX_ADMIN_FRONTEND: ${{ inputs.epr-re-ex-admin-frontend }}
        DECEMBER_WASTE_WINDOW_START: ${{ inputs.december-window-start || steps.december-window.outputs.start }}
      run: |
        (
          export EPR_FRONTEND EPR_BACKEND EPR_RE_EX_ADMIN_FRONTEND DECEMBER_WASTE_WINDOW_START
          build() {
            docker buildx build \
              --cache-from type=gha,scope="$1" \
              --cache-to type=gha,mode=max,scope="$1" \
              --load \
              -t "defradigital/$1:$(git -C "$1" rev-parse --short HEAD)" \
              "$1" 2>&1 | sed "s/^/[$1] /"
          }
          pids=()
          if [ "$BUILD_FRONTEND" = true ]; then
            build epr-frontend & pids+=($!)
            EPR_FRONTEND=$(git -C epr-frontend rev-parse --short HEAD)
          fi
          if [ "$BUILD_BACKEND" = true ]; then
            build epr-backend & pids+=($!)
            EPR_BACKEND=$(git -C epr-backend rev-parse --short HEAD)
          fi
          if [ "$BUILD_ADMIN_FRONTEND" = true ]; then
            build epr-re-ex-admin-frontend & pids+=($!)
            EPR_RE_EX_ADMIN_FRONTEND=$(git -C epr-re-ex-admin-frontend rev-parse --short HEAD)
          fi
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=$?
          done
          if [ "$status" = 0 ]; then
            docker compose up -d --quiet-pull && status=0 || status=$?
          fi
          echo "$status" > compose-up.status.tmp
          mv compose-up.status.tmp compose-up.status
        ) > compose-up.log 2>&1 &

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Upgrade npm
      run: npm install -g npm@11.12.1
      shell: bash

    - name: Install
      run: npm ci
      shell: bash

    # The data generators are the hand-seeding path for local and manual
    # testing; the specs seed from their own fixtures, so nothing else here
    # exercises them and drift in the backend or in the committed templates
    # only surfaces when someone runs them by hand. These two smoke steps keep
    # that drift visible.
    #
    # The spreadsheet half needs no stack (pure ExcelJS + faker), so it runs
    # while compose is still starting in the background. Each variant reads a
    # different template and a different worksheet config, so all five run -
    # ~13s for the set.
    - name: Smoke the spreadsheet generators
      if: inputs.test-suite == 'api' || inputs.test-suite == 'all'
      shell: bash
      run: |
        for variant in exporter input output regOnlyExporter regOnlyReprocessor; do
          npm run "generate:spreadsheet:$variant"
        done

    - name: Cache Playwright browsers
      if: inputs.test-suite != 'api'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    # No --with-deps: the GitHub Ubuntu runner image already carries every
    # library Chromium needs, and the extra fonts apt would add come from a
    # mirror that can take ten minutes to serve them. If a later runner image
    # drops a library, Playwright refuses to launch and names the package.
    - name: Install Playwright browsers
      if: inputs.test-suite != 'api'
      run: npx playwright install chromium
      shell: bash

    - name: Wait for docker compose to finish starting
      shell: bash
      run: |
        timeout 300 bash -c 'until [ -f compose-up.status ]; do sleep 2; done' || true
        cat compose-up.log
        [ "$(cat compose-up.status 2>/dev/null)" = 0 ]

    - name: Wait for services to be ready
      shell: bash
      run: |
        echo "Waiting for backend to be ready..."
        timeout 180 bash -c 'until curl -f http://localhost:3001/health; do sleep 5; done'
        echo "Waiting for frontend to be ready..."
        timeout 180 bash -c 'until curl -f http://localhost:3000/health; do sleep 5; done'
        echo "Waiting for admin frontend to be ready..."
        timeout 180 bash -c 'until curl -f http://localhost:3002/health; do sleep 5; done'

    - name: Run the tests
      shell: bash
      env:
        PW_SCOPE: ${{ inputs.test-scope }}
        PW_SUITE: ${{ inputs.test-suite }}
        PW_DECEMBER: ${{ inputs.december-scope }}
        PW_SHARD: ${{ inputs.shard }}
      run: |
        npm run clean
        if [ "$PW_SUITE" = api ] || { [ "$PW_SUITE" = all ] && [ "$PW_SCOPE" = all ] && [ "$PW_DECEMBER" != only ]; }; then
          npm run test:github:api
        fi
        if [ "$PW_SUITE" != api ]; then
          npm run test:github:browser
        fi
        npm run report

    # After the specs, not before: generated organisations land in the same
    # stack the specs assert against. withLinking is the widest variant - it
    # covers createOrganisation, updateOrganisationData and the Defra ID link
    # path, and the other API generators share those same primitives. A spec
    # failure only touches FAILED rather than exiting non-zero, so this still
    # runs and reports independently.
    - name: Smoke the API data generators
      if: inputs.test-suite == 'api' || inputs.test-suite == 'all'
      shell: bash
      run: npm run generatedata:withLinking

    - name: debug
      if: always()
      run: |
        docker compose logs > logs.txt
        docker ps
      shell: bash

    - name: Upload allure report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: allure-report${{ inputs.artifact-suffix }}
        path: ./allure-report

    - name: Upload allure results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: allure-results${{ inputs.artifact-suffix }}
        path: ./allure-results/*-result.json
        if-no-files-found: ignore

    - name: Upload docker compose logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: docker-compose-logs${{ inputs.artifact-suffix }}
        path: |
          ./logs.txt
          ./compose-up.log

    - name: Fail this step if FAILED file exists
      if: always()
      run: |
        if [ -f "FAILED" ]; then
          exit 1
        fi
      shell: bash
